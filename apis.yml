name: Wave Capital
description: 'Wave Capital is an early-stage venture capital seed fund based in San Francisco,
  founded in 2017 and run as a lean two-partner firm with no additional staff. The fund specializes
  in marketplace startups and was conceived as the "Airbnb mafia" fund, backing pre-Series-A
  founders drawn from the Airbnb, Dropbox, and Facebook alumni networks. Wave leads a highly
  selective portfolio, making no more than four investments per year (typically around $1M) and
  supporting founders with operating experience beyond capital. It publishes no developer API,
  documentation, or developer portal — it is a private investment firm, catalogued in the API
  Evangelist network as a company/VC profile surfaced via foundry-group''s portfolio.'
